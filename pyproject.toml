[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chiron"
version = "0.1.0"
description = "Psychological measurement, behavioural prediction, and population simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.34",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
inference = [
    "openai>=1.91",
    "torch==2.11.0",
    "transformers==5.6.0",
    "peft==0.18.1",
    "accelerate==1.11.0",
    "safetensors==0.7.0",
    "xgrammar==0.2.9",
]
train = [
    "llamafactory",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers==5.6.0",
    "peft==0.18.1",
    "accelerate==1.11.0",
    "deepspeed==0.18.9",
    "flash-attn==2.8.3",
    "liger-kernel==0.8.0",
    "trl==0.24.0",
    "datasets==4.0.0",
    "safetensors==0.7.0",
    "tokenizers==0.22.2",
    "triton==3.6.0",
]
serve = [
    "vllm==0.21.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers==5.16.1",
]

[dependency-groups]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["chiron*"]
exclude = ["chiron-data*"]

[tool.uv]
required-version = ">=0.11.0"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [{ extra = "inference" }, { extra = "serve" }],
    [{ extra = "train" }, { extra = "serve" }],
]

[tool.uv.sources]
llamafactory = { path = "LLaMA-Factory", editable = true }
torch = [
    { index = "pytorch-cu128", extra = "inference" },
    { index = "pytorch-cu128", extra = "train" },
    { index = "pytorch-cu130", extra = "serve" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "train" },
    { index = "pytorch-cu130", extra = "serve" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "train" },
    { index = "pytorch-cu130", extra = "serve" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }, "packaging", "psutil", "ninja"]
deepspeed = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]

[[tool.uv.dependency-metadata]]
name = "deepspeed"
version = "0.18.9"
requires-dist = [
    "einops", "hjson", "msgpack", "ninja", "numpy", "packaging>=20.0",
    "psutil", "py-cpuinfo", "pydantic>=2.0.0", "torch", "tqdm",
]
